name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  authorize-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Validate manual authorization
        env:
          CONFIRM: ${{ inputs.confirm_deploy }}
        run: test "$CONFIRM" = "DEPLOY_PRODUCTION"

  manual-build-test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_reusable-build-test.yml
    with:
      ref: main
      git_commit_sha: ${{ github.sha }}
    secrets:
      # Prefer dedicated MSHOPS_CHECKOUT_TOKEN; fall back to GH_PAT until Operator splits.
      GH_PAT: ${{ secrets.MSHOPS_CHECKOUT_TOKEN || secrets.GH_PAT }}
    permissions:
      contents: read
      actions: write

  manual-dry-run:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_reusable-wrangler-dry-run.yml
    with:
      ref: main
      git_commit_sha: ${{ github.sha }}
    secrets:
      GH_PAT: ${{ secrets.MSHOPS_CHECKOUT_TOKEN || secrets.GH_PAT }}
    permissions:
      contents: read
      actions: write

  deploy:
    needs: [authorize-manual, manual-build-test, manual-dry-run]
    if: >-
      always() && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
         needs.authorize-manual.result == 'success' &&
         needs.manual-build-test.result == 'success' &&
         needs.manual-dry-run.result == 'success')
      )
    runs-on: ubuntu-22.04
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out SHA is the gated deploy SHA
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ github.token }}"
        run: |
          set -euo pipefail
          # Pin to the CI-/dispatch-gated SHA. Do not require equality with
          # origin/main tip (main may advance after the gated CI run).
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git fetch --no-tags origin main
          # Fail-closed if the gated SHA is no longer on main history.
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
      - name: Clone MSHOPS storefront artifact
        uses: ./.github/actions/checkout-mshops-artifact
        with:
          token: ${{ secrets.MSHOPS_CHECKOUT_TOKEN || secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/MSHOPS
      - name: Prove later steps cannot read GH_PAT
        run: node scripts/ci/assert-no-mshops-token.mjs
      - uses: ./.github/actions/setup-node-npm
        with:
          node-version: "24"
      - name: Final build
        env:
          GIT_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          node scripts/ci/assert-no-mshops-token.mjs
          test -n "${MSHOPS_BUILD_DIR:?MSHOPS_BUILD_DIR missing after clone step}"
          test -f "$MSHOPS_BUILD_DIR/app/index.html"
          npm run build
      - name: Final dry run
        run: npx wrangler deploy --dry-run --outdir .artifacts/production-predeploy
      - name: Deploy exact gated SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var BUILD_COMMIT_SHA:${DEPLOY_SHA} --var BUILD_TIMESTAMP:${{ github.run_started_at }}
      - name: Smoke test (hard gate, retry/backoff)
        run: |
          set -euo pipefail
          sleep 20
          for route in / /pearl-os /products /status; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -L -o /tmp/body -w "%{http_code}" "https://www.mshops.net$route" || true)
              if [ "$code" = "200" ]; then
                ok=1
                echo "OK $route (attempt $attempt)"
                break
              fi
              echo "WARN $route returned ${code:-curl-fail} on attempt $attempt"
              sleep $((attempt * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: $route failed smoke after retries"
              cat /tmp/body || true
              exit 1
            fi
          done
