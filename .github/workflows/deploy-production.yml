# Manual production deployment only — never on push.
# Requires the typed confirmation phrase, a commit already on main, green
# lint/pin audit, build/test, dry runs, and the "production" GitHub Environment
# (add required reviewers to that Environment to make it an approval gate).
# PR code never runs on self-hosted runners.
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_PAT

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_PRODUCTION to authorize deployment
        required: true
        type: string
      target_ref:
        description: Ref to deploy; must resolve to a commit on main
        required: true
        default: main
        type: string
      reason:
        description: Optional deployment reason for audit logs
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      requested_ref: ${{ steps.resolve.outputs.requested_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate deployment authorization
        id: resolve
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          TARGET_REF: ${{ inputs.target_ref }}
          DEPLOY_TARGET: production
        run: node scripts/ci/resolve-deploy-ref.mjs

  preflight:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.commit_sha }}
          persist-credentials: false

      - run: node scripts/ci/workflow-permissions-lint.mjs

      - run: node scripts/ci/audit-action-pins.mjs

  build-test:
    needs: [authorize, preflight]
    uses: ./.github/workflows/_reusable-build-test.yml
    with:
      ref: ${{ needs.authorize.outputs.commit_sha }}
      git_commit_sha: ${{ needs.authorize.outputs.commit_sha }}
    permissions:
      contents: read
      actions: write

  production-dry-run:
    needs: [authorize, preflight]
    uses: ./.github/workflows/_reusable-wrangler-dry-run.yml
    with:
      ref: ${{ needs.authorize.outputs.commit_sha }}
      git_commit_sha: ${{ needs.authorize.outputs.commit_sha }}
    permissions:
      contents: read
      actions: write

  deploy-production:
    needs: [authorize, build-test, production-dry-run]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_COMMIT_SHA: ${{ needs.authorize.outputs.commit_sha }}
      BUILD_TIMESTAMP: ${{ github.run_started_at }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.commit_sha }}
          persist-credentials: false

      - name: Record deployment request
        env:
          REQUESTED_REF: ${{ needs.authorize.outputs.requested_ref }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Deploying $GIT_COMMIT_SHA (requested ref: $REQUESTED_REF) by $GITHUB_ACTOR"
          echo "Reason: ${REASON:-not provided}"

      - name: Clone MSHOPS storefront artifact
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "ERROR: GH_PAT is required to clone the private MSHOPS storefront"
            exit 1
          fi
          # Command-scoped header. Do not put the token in the remote URL; that
          # value is written to .git/config and can show up in later git errors.
          auth=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w 0)
          header="AUTHORIZATION: basic ${auth}"
          git -c "http.extraheader=${header}" clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${{ github.repository_owner }}/MSHOPS.git" \
            MSHOPS
          git -C MSHOPS -c "http.extraheader=${header}" sparse-checkout set build-final
          unset auth header
          test -f MSHOPS/build-final/app/index.html || (echo "ERROR: MSHOPS build-final/app/index.html missing" && exit 1)
          rm -rf MSHOPS/.git
          echo "MSHOPS storefront artifact found"

      - uses: ./.github/actions/setup-node-npm
        with:
          node-version: "24"

      - run: npm run typecheck

      - run: npm test

      - name: Build
        env:
          MSHOPS_BUILD_DIR: ${{ github.workspace }}/MSHOPS/build-final
        run: npm run build

      - name: Refuse the CI sample storefront
        run: node scripts/ci/assert-real-storefront.mjs

      - name: Wrangler production dry run (pre-deploy gate)
        run: npx wrangler deploy --dry-run --outdir .artifacts/wrangler-production-predeploy

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var "BUILD_COMMIT_SHA:${GIT_COMMIT_SHA}" --var "BUILD_TIMESTAMP:${BUILD_TIMESTAMP}"

      - name: Smoke test (fails the job on a non-200 or SHA mismatch)
        env:
          SMOKE_URL: https://www.mshops.net/pearl-os
        run: |
          set -euo pipefail
          passed=0
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SMOKE_URL" || echo "000")
            echo "Attempt $attempt: $SMOKE_URL -> $status"
            if [ "$status" = "200" ]; then
              passed=1
              break
            fi
            sleep 10
          done
          if [ "$passed" != "1" ]; then
            echo "::error::Smoke test failed: $SMOKE_URL did not return 200. Roll back with 'npx wrangler rollback' if this deploy caused it."
            exit 1
          fi
          origin=$(node -e 'const u = new URL(process.env.SMOKE_URL); console.log(u.origin)')
          body=$(curl -fsS --max-time 15 "$origin/api/build-info")
          node --input-type=module -e '
            const info = JSON.parse(process.argv[1]);
            if (info.commitSha !== process.env.GIT_COMMIT_SHA) {
              console.error("::error::build-info commitSha does not match the authorized production deploy");
              process.exit(1);
            }
            if (info.deployEnv !== "production") {
              console.error("::error::build-info deployEnv is not production");
              process.exit(1);
            }
          ' "$body"
          echo "Smoke test passed"
