# Auto-deploy to Cloudflare Workers on push to main.
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_PAT

name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Clone MSHOPS storefront artifact
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/MSHOPS.git \
            MSHOPS
          cd MSHOPS && git sparse-checkout set build-final
          test -f build-final/app/index.html || (echo "ERROR: MSHOPS build-final/app/index.html missing" && exit 1)
          echo "MSHOPS storefront artifact found"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          MSHOPS_BUILD_DIR: ${{ github.workspace }}/MSHOPS/build-final
          GIT_COMMIT_SHA: ${{ github.sha }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp || '2026-01-01T00:00:00Z' }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env "" --var BUILD_COMMIT_SHA:${{ github.sha }} --var BUILD_TIMESTAMP:$(date -u +%Y-%m-%dT%H-%M-%SZ)

      - name: Smoke test
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.mshops.net/pearl-os)
          echo "Pearl OS route status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "/pearl-os returned $STATUS"
          else
            echo "Pearl OS is live"
          fi
