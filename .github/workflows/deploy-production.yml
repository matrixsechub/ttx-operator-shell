# Production deployment.
#
# Fail-closed order: preflight lint -> build+test -> wrangler dry run ->
# `production` GitHub Environment approval -> deploy -> fail-closed smoke.
# Nothing reaches Cloudflare until every preceding job is green and a required
# reviewer on the `production` Environment has approved.
#
# Operator settings required (see docs/OPERATOR-SETTINGS-PRODUCTION.md):
#   - GitHub Environment named `production` with required reviewers
#   - environment-scoped secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_PAT
#   - environment variable PRODUCTION_BASE_URL

name: Deploy Production

# Production is NOT deployed by merging to main. Deployment is an explicit,
# confirmed, Operator-initiated action.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY_PRODUCTION to authorize deployment
        required: true
        type: string
      target_ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main
        type: string
      reason:
        description: Optional deployment reason for audit logs
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Validates the confirmation phrase and resolves target_ref to an immutable
  # commit SHA. Every downstream job builds, verifies, and deploys that exact
  # SHA, so the ref cannot move underneath the pipeline.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      requested_ref: ${{ steps.resolve.outputs.requested_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate deployment authorization
        id: resolve
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
          TARGET_REF: ${{ inputs.target_ref }}
          DEPLOY_TARGET: production
        run: node scripts/ci/resolve-deploy-ref.mjs

  preflight:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.commit_sha }}

      - run: node scripts/ci/workflow-permissions-lint.mjs

      - run: node scripts/ci/audit-action-pins.mjs

  # Typecheck, brand lint, full test suite, build. Reused, not duplicated.
  build-test:
    needs: authorize
    uses: ./.github/workflows/_reusable-build-test.yml
    with:
      ref: ${{ needs.authorize.outputs.commit_sha }}
      git_commit_sha: ${{ needs.authorize.outputs.commit_sha }}
    permissions:
      contents: read
      actions: write

  # Dry run against the real production config before any mutation.
  production-dry-run:
    needs: authorize
    uses: ./.github/workflows/_reusable-wrangler-dry-run.yml
    with:
      ref: ${{ needs.authorize.outputs.commit_sha }}
      git_commit_sha: ${{ needs.authorize.outputs.commit_sha }}
    permissions:
      contents: read
      actions: write

  deploy:
    needs: [authorize, preflight, build-test, production-dry-run]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      GIT_COMMIT_SHA: ${{ needs.authorize.outputs.commit_sha }}
      BUILD_TIMESTAMP: ${{ github.run_started_at }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.commit_sha }}

      - name: Clone MSHOPS storefront artifact
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/MSHOPS.git \
            MSHOPS
          cd MSHOPS && git sparse-checkout set build-final
          test -f build-final/app/index.html || (echo "ERROR: MSHOPS build-final/app/index.html missing" && exit 1)
          echo "MSHOPS storefront artifact found"

      - uses: ./.github/actions/setup-node-npm
        with:
          node-version: "24"

      - name: Build
        env:
          MSHOPS_BUILD_DIR: ${{ github.workspace }}/MSHOPS/build-final
        run: npm run build

      - name: Wrangler production dry run (pre-deploy gate)
        run: npx wrangler deploy --dry-run --outdir .artifacts/wrangler-production-predeploy

      # Build identity must be supplied explicitly: wrangler.jsonc pins
      # BUILD_COMMIT_SHA to "unknown", and env vars take precedence over the
      # bundled value, so without these flags production cannot report its own
      # commit (F4). Colon-bearing ISO timestamps parse correctly — verified by
      # `wrangler deploy --dry-run --var BUILD_TIMESTAMP:<iso>`.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var BUILD_COMMIT_SHA:${GIT_COMMIT_SHA} \
            --var BUILD_TIMESTAMP:${BUILD_TIMESTAMP}

      - name: Capture deployment metadata
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          mkdir -p artifacts
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            writeFileSync('artifacts/production-deploy-metadata.json', JSON.stringify({
              commit_sha: process.env.GIT_COMMIT_SHA,
              worker_name: 'ttx-operator-shell',
              deployed_at: new Date().toISOString(),
              requested_ref: '${{ needs.authorize.outputs.requested_ref }}',
              workflow_run_id: '${{ github.run_id }}',
              actor: '${{ github.actor }}',
              reason: process.env.DEPLOY_REASON ?? ''
            }, null, 2));
          "
          npx wrangler --version | head -n 1 > artifacts/wrangler-version.txt
          node --version > artifacts/node-version.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deploy-metadata
          path: |
            artifacts/production-deploy-metadata.json
            artifacts/wrangler-version.txt
            artifacts/node-version.txt
            dist/.build-manifest.json
          retention-days: 14
          if-no-files-found: error

  # Fail-closed: a non-zero exit here fails the workflow. Targets the production
  # Worker (vars.PRODUCTION_BASE_URL, hostname-allowlisted in the script) and
  # asserts the deployed build reports the commit we just shipped.
  production-smoke:
    needs: [authorize, deploy]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.commit_sha }}

      - name: Run production smoke tests
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          COMMIT_SHA: ${{ needs.authorize.outputs.commit_sha }}
        run: node scripts/ci/production-smoke.mjs "$PRODUCTION_BASE_URL" "$COMMIT_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-smoke-report
          path: artifacts/production-smoke-report.json
          retention-days: 14
          if-no-files-found: error
